[project]
name = "spain-power-prices"
version = "0.1.0"
description = "Spanish day-ahead power prices vs renewables: OMIE + REE loaders, analysis notebook and Streamlit dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Josh Vanderspuy" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "plotly>=5.22",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "nbformat", "nbconvert", "ipykernel", "kaleido>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["E501"]
