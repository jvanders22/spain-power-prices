[project]
name = "spain-power-prices"
version = "0.1.0"
description = "Spanish day-ahead power prices vs renewables: OMIE + REE loaders, analysis notebook and Streamlit dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Josh Vanderspuy" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "plotly>=5.22",
  "streamlit>=1.36",
]

[project.optional-dependencies]
# scikit-learn is only needed for the D+2 forecast backtest (scripts/backtest_forecast.py) and its tests.
dev = ["pytest>=8", "ruff>=0.5", "nbformat", "nbconvert", "ipykernel", "kaleido>=0.2", "scikit-learn>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spain_power = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["E501"]
"scripts/build_forecast_notebook.py" = ["E501"]
