name: pages

# Builds the static site (scripts/build_site.py) and deploys it to GitHub Pages.
# Runs on pushes to main, by hand, and after a successful daily refresh on main. A workflow_run
# build checks out main, so it only shows new data when the refresh commits the table
# back (repository variable COMMIT_DATA=true).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [daily-refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Pages on the Free plan needs a public repo; Josh flips the repository variable
  # PAGES_ENABLED to 'true' after making the repo public and enabling Pages (source:
  # GitHub Actions). Until then the site is only built, never deployed. Only main is ever
  # deployed, including when the workflow is started by hand from another branch.
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
