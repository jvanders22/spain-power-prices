name: daily-refresh

# Fetches the latest OMIE + REE data, rebuilds the hourly table and runs the tests.
# OMIE publishes next-day prices around 13:00 CET; 14:30 UTC leaves margin.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Refresh data
        run: python scripts/refresh.py
      # The case study (docs/case_study.md + README section) quotes numbers from the table.
      - name: Regenerate case study
        run: python scripts/build_case_study.py
      - name: Tests
        run: pytest -q
      - name: Upload hourly table
        uses: actions/upload-artifact@v4
        with:
          name: hourly-parquet
          path: data/processed/hourly.parquet
          retention-days: 14
      # Committing the refreshed table is opt-in (repo variable COMMIT_DATA=true) so the
      # history doesn't grow by ~3 MB a day unless you want the deployed app to auto-update.
      - name: Commit refreshed data
        if: vars.COMMIT_DATA == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/hourly.parquet docs/case_study.md README.md
          git diff --cached --quiet && exit 0
          git commit -m "data: daily refresh $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
