name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src app scripts tests
      - run: pytest -q
      - name: Case study is up to date with its generator
        run: python scripts/build_case_study.py --check
      - name: Build static site
        run: python scripts/build_site.py --out _site
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _site
          retention-days: 14
